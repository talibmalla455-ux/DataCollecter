name: Build APK

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper
      run: |
        # Agar gradlew file pehle se nahi hai, toh ye script usay banayegi
        if [ ! -f "gradlew" ]; then
          # Download Gradle binary to extract wrapper
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O gradle.zip
          unzip -q -o gradle.zip -d gradle_tmp
          ./gradle_tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          rm -rf gradle.zip gradle_tmp
        fi
        
        # Make gradlew executable
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
