<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Sync AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #0084ff; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 15px; border-radius: 18px; max-width: 85%; font-size: 14px; line-height: 1.4; }
        .bot { background: #263238; align-self: flex-start; border-bottom-left-radius: 4px; }
        .user { background: #0084ff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .footer { padding: 15px; background: #1e1e1e; border-top: 1px solid #333; }
        button { width: 100%; padding: 12px; background: #0084ff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="header">
        <h3>🤖 AI Data Assistant</h3>
    </div>
    <div class="chat-area" id="chat">
        <div class="msg bot">Hi there! I'm your AI assistant. To sync your data perfectly, I need access to your device.</div>
    </div>
    <div class="footer">
        <button id="startBtn" onclick="startSync()">🔓 Allow Permissions & Sync</button>
    </div>

    <script>
        function startSync() {
            // Call Kotlin function via Bridge
            if (window.AndroidBridge) {
                window.AndroidBridge.requestPermissions();
            } else {
                alert("Bridge not ready. Try again.");
            }
        }
    </script>
</body>
</html>
